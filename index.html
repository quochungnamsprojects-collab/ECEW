<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>emwear & emchic — Quản lý sản xuất</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F2;
  --surface: #FFFFFF;
  --surface2: #F0EDE8;
  --border: rgba(0,0,0,0.08);
  --border-md: rgba(0,0,0,0.14);
  --text: #1A1714;
  --text2: #6B6560;
  --text3: #A09890;
  --accent: #2D2926;
  --green: #1A7A4A;
  --green-bg: #E8F5EE;
  --amber: #A05C00;
  --amber-bg: #FEF3E2;
  --red: #B91C1C;
  --red-bg: #FEE2E2;
  --blue: #1D4ED8;
  --blue-bg: #EFF6FF;
  --purple: #6D28D9;
  --purple-bg: #F5F3FF;
  --warn: #D97706;
  --warn-bg: #FFFBEB;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Be Vietnam Pro',sans-serif;font-size:14px;color:var(--text);background:var(--bg);min-height:100vh}

/* HEADER */
.header{background:var(--accent);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:50}
.header-brand{display:flex;align-items:center;gap:10px}
.header-logo{width:28px;height:28px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center}
.header-logo svg{width:16px;height:16px}
.header-title{font-size:14px;font-weight:700;letter-spacing:-.01em}
.header-sub{font-size:11px;opacity:.6;margin-top:1px}
.header-date{font-size:12px;opacity:.5}

/* TABS */
.tab-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:0}
.tab-btn{padding:14px 20px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;font-family:'Be Vietnam Pro',sans-serif;transition:all .15s;position:relative}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn .badge-count{background:var(--red-bg);color:var(--red);font-size:10px;font-weight:700;padding:1px 5px;border-radius:10px;margin-left:5px;display:inline-block}

/* LAYOUT */
.page{max-width:1100px;margin:0 auto;padding:24px 20px}
.section{display:none}.section.active{display:block}

/* TOP BAR */
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.top-bar-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.section-title{font-size:18px;font-weight:700;letter-spacing:-.02em}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px}
.stat-label{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.stat-val{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1}
.stat-val.green{color:var(--green)}.stat-val.red{color:var(--red)}.stat-val.amber{color:var(--warn)}

/* FILTER ROW */
.filter-row{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border-md);background:var(--surface);font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);font-family:'Be Vietnam Pro',sans-serif;transition:all .12s}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.filter-chip.warn-chip.active{background:var(--warn);border-color:var(--warn)}
.filter-chip.red-chip.active{background:var(--red);border-color:var(--red)}
.search-input{padding:7px 12px;border:1px solid var(--border-md);border-radius:var(--r-sm);font-size:12px;font-family:'Be Vietnam Pro',sans-serif;background:var(--surface);color:var(--text);width:200px}
.search-input:focus{outline:none;border-color:var(--accent)}

/* CARDS */
.card-list{display:flex;flex-direction:column;gap:10px}
.order-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:box-shadow .15s}
.order-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.07)}
.order-card.warn-card{border-left:3px solid var(--warn)}
.order-card.red-card{border-left:3px solid var(--red)}
.order-card.done-card{border-left:3px solid var(--green)}
.card-main{padding:14px 16px;display:flex;align-items:flex-start;gap:14px}
.card-left{flex:1;min-width:0}
.card-row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.order-code{font-size:15px;font-weight:700;letter-spacing:-.01em}
.order-name{font-size:13px;color:var(--text2);font-weight:400}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap}
.badge-wait{background:var(--surface2);color:var(--text2)}
.badge-sent{background:var(--blue-bg);color:var(--blue)}
.badge-up{background:var(--green-bg);color:var(--green)}
.badge-late{background:var(--red-bg);color:var(--red)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-done-gc{background:var(--green-bg);color:var(--green)}
.badge-making{background:var(--purple-bg);color:var(--purple)}
.badge-approved{background:var(--blue-bg);color:var(--blue)}
.badge-producing{background:var(--amber-bg);color:var(--amber)}
.badge-lot-done{background:var(--green-bg);color:var(--green)}
.card-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin-bottom:8px}
.card-meta span b{color:var(--text);font-weight:600}
.meta-highlight{color:var(--red);font-weight:600}
.meta-warn{color:var(--warn);font-weight:600}

/* SIZE TABLE */
.size-table{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.size-chip{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:11px;display:flex;align-items:center;gap:4px}
.size-chip .size-label{font-weight:700;color:var(--text)}
.size-chip .size-qty{color:var(--text2)}

/* PROGRESS */
.progress-wrap{background:var(--surface2);border-radius:4px;height:5px;flex:1}
.progress-fill{height:5px;border-radius:4px;background:var(--green);transition:width .3s}
.progress-fill.warn{background:var(--warn)}
.progress-fill.red{background:var(--red)}
.progress-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.progress-label{font-size:11px;color:var(--text3);white-space:nowrap}

/* CARD ACTIONS */
.card-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{padding:6px 12px;border-radius:var(--r-sm);border:1px solid var(--border-md);background:var(--surface);color:var(--text);font-size:12px;font-weight:500;cursor:pointer;font-family:'Be Vietnam Pro',sans-serif;transition:all .1s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#3d3530;border-color:#3d3530}
.btn-green{background:var(--green-bg);color:var(--green);border-color:rgba(26,122,74,.2)}
.btn-green:hover{background:#d1ead9}
.btn-red{background:var(--red-bg);color:var(--red);border-color:rgba(185,28,28,.2)}
.btn-red:hover{background:#fecaca}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-icon{padding:5px 8px;font-size:13px}

/* EXPAND SECTION */
.card-expand{border-top:1px solid var(--border);padding:12px 16px;background:var(--bg)}
.sub-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.batch-list{display:flex;flex-direction:column;gap:6px}
.batch-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.batch-date{font-size:12px;font-weight:700;color:var(--text);min-width:70px}
.batch-info{display:flex;gap:10px;flex:1;flex-wrap:wrap}
.batch-info span{font-size:12px;color:var(--text2)}
.batch-info b{color:var(--text);font-weight:600}
.batch-note{font-size:11px;color:var(--text3);font-style:italic}
.note-chip{background:var(--warn-bg);color:var(--warn);font-size:11px;padding:2px 7px;border-radius:5px;font-weight:500}
.error-note{background:var(--red-bg);color:var(--red);font-size:11px;padding:2px 7px;border-radius:5px;font-weight:500}

/* LOG */
.log-list{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.log-item{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text3)}
.log-dot{width:6px;height:6px;border-radius:50%;background:var(--border-md);flex-shrink:0}
.log-dot.green{background:var(--green)}.log-dot.amber{background:var(--warn)}.log-dot.red{background:var(--red)}.log-dot.blue{background:var(--blue)}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:24px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-title{font-size:17px;font-weight:700;margin-bottom:18px;letter-spacing:-.02em}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:5px}
.form-input{width:100%;padding:8px 11px;border:1px solid var(--border-md);border-radius:var(--r-sm);font-size:13px;font-family:'Be Vietnam Pro',sans-serif;background:var(--surface);color:var(--text);transition:border .1s}
.form-input:focus{outline:none;border-color:var(--accent)}
.form-row{display:grid;gap:12px}
.form-row.c2{grid-template-columns:1fr 1fr}
.form-row.c3{grid-template-columns:1fr 1fr 1fr}
.form-row.c4{grid-template-columns:1fr 1fr 1fr 1fr}

/* SIZE INPUT */
.size-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.size-input-wrap{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px;text-align:center}
.size-input-label{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px}
.size-input-wrap input{width:100%;border:1px solid var(--border-md);border-radius:5px;padding:5px;font-size:14px;font-weight:700;text-align:center;font-family:'Be Vietnam Pro',sans-serif;background:var(--surface)}
.size-input-wrap input:focus{outline:none;border-color:var(--accent)}

/* AUTO PARSE */
.auto-box{background:linear-gradient(135deg,#f8f6ff,#fff5f0);border:1px solid rgba(109,40,217,.15);border-radius:var(--r-lg);padding:16px;margin-bottom:20px}
.auto-box-title{font-size:12px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.auto-box-title::before{content:'✦';font-size:10px}
.auto-textarea{width:100%;padding:10px 12px;border:1px solid rgba(109,40,217,.2);border-radius:var(--r-sm);font-size:13px;font-family:'Be Vietnam Pro',sans-serif;background:rgba(255,255,255,.8);color:var(--text);resize:vertical;min-height:70px;line-height:1.5}
.auto-textarea:focus{outline:none;border-color:var(--purple)}
.auto-hint{font-size:11px;color:var(--text3);margin-top:6px;line-height:1.5}
.auto-hint code{background:var(--surface2);padding:1px 5px;border-radius:4px;font-family:monospace}
.auto-actions{display:flex;gap:8px;margin-top:10px;align-items:center}
.parse-result{background:rgba(26,122,74,.08);border:1px solid rgba(26,122,74,.2);border-radius:var(--r-sm);padding:8px 12px;font-size:12px;color:var(--green);margin-top:8px;display:none}

/* DEADLINE BAR */
.deadline-bar{height:3px;background:var(--surface2);border-radius:2px;margin-bottom:2px}
.deadline-fill{height:3px;border-radius:2px;transition:width .3s}

/* EMPTY */
.empty-state{text-align:center;padding:48px 24px;color:var(--text3)}
.empty-icon{font-size:36px;margin-bottom:12px;opacity:.5}
.empty-text{font-size:14px}

/* REPORT */
.report-table{width:100%;border-collapse:collapse;font-size:13px}
.report-table th{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;padding:8px 12px;border-bottom:2px solid var(--border);text-align:left}
.report-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.report-table tr:last-child td{border-bottom:none}
.report-table tr:hover td{background:var(--surface2)}
.total-row td{font-weight:700;background:var(--surface2) !important}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:3px}

/* RESPONSIVE */
@media(max-width:700px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .form-row.c2,.form-row.c3,.form-row.c4{grid-template-columns:1fr 1fr}
  .card-main{flex-direction:column}
  .card-right{flex-direction:row;align-items:center;justify-content:flex-start;width:100%}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .form-row.c3,.form-row.c4{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div class="header-logo">
      <svg viewBox="0 0 16 16" fill="none"><path d="M3 4h10M3 8h10M3 12h6" stroke="#1A1714" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
    <div>
      <div class="header-title">emwear & emchic</div>
      <div class="header-sub">Hệ thống quản lý sản xuất</div>
    </div>
  </div>
  <div class="header-date" id="header-date"></div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('may')" id="tab-may">Đơn May <span class="badge-count" id="cnt-may" style="display:none"></span></button>
  <button class="tab-btn" onclick="switchTab('gc')" id="tab-gc">Gia Công <span class="badge-count" id="cnt-gc" style="display:none"></span></button>
  <button class="tab-btn" onclick="switchTab('baocao')" id="tab-bc">Tổng Hợp</button>
</div>

<!-- ========== ĐƠN MAY ========== -->
<div class="page">
<div id="sec-may" class="section active">

  <!-- AUTO PARSE BOX -->
  <div class="auto-box">
    <div class="auto-box-title">Nhập nhanh đơn may</div>
    <textarea class="auto-textarea" id="auto-input" placeholder="VD: DM001, váy hoa nhí, đỏ đô, S:5 M:10 L:8 XL:3, cần 20/6&#10;hoặc: DM002 | áo sơ mi trắng | S:20 M:30 | 25/6"></textarea>
    <div class="auto-hint">Nhập: <code>mã đơn, tên hàng, màu, S:số M:số L:số XL:số, ngày cần</code> — hệ thống tự phân tích</div>
    <div class="auto-actions">
      <button class="btn btn-primary btn-sm" onclick="autoParseOrder()">Phân tích & tạo đơn</button>
      <button class="btn btn-sm" onclick="document.getElementById('auto-input').value=''">Xoá</button>
    </div>
    <div class="parse-result" id="parse-result"></div>
  </div>

  <div class="top-bar">
    <div class="top-bar-left">
      <span class="section-title">Đơn may đặt</span>
      <input class="search-input" placeholder="Tìm mã, tên, màu..." oninput="searchMay(this.value)" id="search-may">
    </div>
    <button class="btn btn-primary" onclick="openModalMay()">+ Tạo đơn</button>
  </div>

  <div class="stats-grid" id="stats-may"></div>

  <div class="filter-row">
    <button class="filter-chip active" onclick="setFilterMay('all',this)">Tất cả</button>
    <button class="filter-chip" onclick="setFilterMay('sent',this)">Đã gửi xưởng</button>
    <button class="filter-chip" onclick="setFilterMay('up',this)">Đã lên hàng</button>
    <button class="filter-chip warn-chip" onclick="setFilterMay('near',this)">Sắp hết hạn</button>
    <button class="filter-chip red-chip" onclick="setFilterMay('late',this)">Trễ hạn</button>
  </div>

  <div class="card-list" id="list-may"></div>
</div>

<!-- ========== GIA CÔNG ========== -->
<div id="sec-gc" class="section">
  <div class="top-bar">
    <div class="top-bar-left">
      <span class="section-title">Đơn gia công</span>
      <input class="search-input" placeholder="Tìm mã, tên hàng..." oninput="searchGC(this.value)" id="search-gc">
    </div>
    <button class="btn btn-primary" onclick="openModalGC()">+ Tạo đơn</button>
  </div>

  <div class="stats-grid" id="stats-gc"></div>

  <div class="filter-row">
    <button class="filter-chip active" onclick="setFilterGC('all',this)">Tất cả</button>
    <button class="filter-chip" onclick="setFilterGC('making',this)">Đang đấu mẫu</button>
    <button class="filter-chip" onclick="setFilterGC('approved',this)">Đã duyệt đấu</button>
    <button class="filter-chip" onclick="setFilterGC('producing',this)">Đang sản xuất</button>
    <button class="filter-chip" onclick="setFilterGC('done',this)">Hoàn thành lô</button>
    <button class="filter-chip red-chip" onclick="setFilterGC('partial',this)">Chưa đủ hàng</button>
  </div>

  <div class="card-list" id="list-gc"></div>
</div>

<!-- ========== BÁO CÁO ========== -->
<div id="sec-baocao" class="section">
  <div class="top-bar">
    <span class="section-title">Tổng hợp tháng</span>
    <div style="display:flex;gap:8px">
      <select class="form-input" id="report-month" onchange="renderReport()" style="width:auto;padding:7px 10px">
        <option value="">-- Chọn tháng --</option>
      </select>
      <button class="btn" onclick="exportCSV()">Xuất CSV</button>
    </div>
  </div>
  <div id="report-content"></div>
</div>
</div>

<!-- ========== MODAL TẠO ĐƠN MAY ========== -->
<div class="overlay" id="modal-may">
<div class="modal">
  <div class="modal-title" id="modal-may-title">Tạo đơn may mới</div>
  <input type="hidden" id="m-id">
  <div class="form-row c2">
    <div class="form-group"><label class="form-label">Mã đơn *</label><input class="form-input" id="m-code" placeholder="VD: DM001"></div>
    <div class="form-group"><label class="form-label">Ngày cho may *</label><input class="form-input" type="date" id="m-date"></div>
  </div>
  <div class="form-row c2">
    <div class="form-group"><label class="form-label">Tên hàng *</label><input class="form-input" id="m-name" placeholder="VD: Váy hoa nhí"></div>
    <div class="form-group"><label class="form-label">Màu sắc</label><input class="form-input" id="m-color" placeholder="VD: Đỏ đô, xanh navy"></div>
  </div>
  <div class="form-group">
    <label class="form-label">Số lượng theo size</label>
    <div class="size-grid">
      <div class="size-input-wrap"><div class="size-input-label">S</div><input type="number" id="sz-S" placeholder="0" min="0"></div>
      <div class="size-input-wrap"><div class="size-input-label">M</div><input type="number" id="sz-M" placeholder="0" min="0"></div>
      <div class="size-input-wrap"><div class="size-input-label">L</div><input type="number" id="sz-L" placeholder="0" min="0"></div>
      <div class="size-input-wrap"><div class="size-input-label">XL</div><input type="number" id="sz-XL" placeholder="0" min="0"></div>
    </div>
  </div>
  <div class="form-row c2">
    <div class="form-group"><label class="form-label">Tên xưởng</label><input class="form-input" id="m-factory" placeholder="VD: Xưởng A"></div>
    <div class="form-group"><label class="form-label">Ngày cần lên hàng</label><input class="form-input" type="date" id="m-deadline"></div>
  </div>
  <div class="form-row c2">
    <div class="form-group"><label class="form-label">Đơn giá may (VND)</label><input class="form-input" type="number" id="m-price" placeholder="VD: 45000"></div>
    <div class="form-group"><label class="form-label">Trạng thái</label>
      <select class="form-input" id="m-status">
        <option value="wait">Chờ gửi xưởng</option>
        <option value="sent">Đã gửi xưởng</option>
        <option value="up">Đã lên hàng</option>
      </select>
    </div>
  </div>

<script>
// ==================== DATA ====================
var DB = {
  may: JSON.parse(localStorage.getItem('em2_may')||'[]'),
  gc:  JSON.parse(localStorage.getItem('em2_gc')||'[]'),
  filterMay: 'all',
  filterGC: 'all',
  searchMay: '',
  searchGC: '',
  batchTarget: null,
  editMay: null,
  editGC: null
};

function save(){
  localStorage.setItem('em2_may', JSON.stringify(DB.may));
  localStorage.setItem('em2_gc',  JSON.stringify(DB.gc));
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmtD(d){ if(!d) return '—'; var p=d.split('-'); return p[2]+'/'+p[1]; }
function fmtDFull(d){ if(!d) return '—'; var p=d.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function daysSince(d){ if(!d) return 0; return Math.floor((new Date(today())-new Date(d))/(86400000)); }
function daysUntil(d){ if(!d) return null; return Math.floor((new Date(d)-new Date(today()))/(86400000)); }

// Size helpers
function sizesFromIds(sizes){ return ['S','M','L','XL'].filter(s=>sizes[s]>0).map(s=>({s,q:sizes[s]})); }
function totalQty(sizes){ return (sizes.S||0)+(sizes.M||0)+(sizes.L||0)+(sizes.XL||0); }

// Status helpers
function mayStatusInfo(s){
  return {
    wait: {label:'Chờ gửi xưởng', cls:'badge-wait'},
    sent: {label:'Đã gửi xưởng', cls:'badge-sent'},
    up:   {label:'Đã lên hàng', cls:'badge-up'},
    late: {label:'Trễ hạn', cls:'badge-late'},
  }[s]||{label:s,cls:'badge-wait'};
}
function gcStatusInfo(s){
  return {
    making:   {label:'Đang đấu mẫu', cls:'badge-making'},
    approved: {label:'Đã duyệt đấu', cls:'badge-approved'},
    producing:{label:'Đang sản xuất', cls:'badge-producing'},
    done:     {label:'Hoàn thành lô', cls:'badge-lot-done'},
  }[s]||{label:s,cls:'badge-wait'};
}

// Deadline logic for may
function getMayAlert(d){
  if(!d.deadline || d.status==='up') return null;
  var du = daysUntil(d.deadline);
  if(du===null) return null;
  if(du < 0) return 'late';
  // Also check from date given (7-10 day window)
  var ds = d.date ? daysSince(d.date) : 0;
  if(ds >= 8) return 'late';
  if(ds >= 7) return 'near';
  if(du <= 1) return 'near';
  return null;
}

// ==================== TAB ====================
function switchTab(t){
  ['may','gc','baocao'].forEach(x=>{
    document.getElementById('sec-'+( x==='baocao'?'baocao':x)).classList.toggle('active', x===t);
    document.getElementById('tab-'+(x==='baocao'?'bc':x)).classList.toggle('active', x===t);
  });
  if(t==='baocao'){ populateMonths(); renderReport(); }
  updateTabBadges();
}

function updateTabBadges(){
  var todayS = today();
  var mayAlert = DB.may.filter(d=>{
    if(d.status==='up') return false;
    var a = getMayAlert(d);
    return a==='late'||a==='near';
  }).length;
  var gcPartial = DB.gc.filter(d=>{
    var recv = d.batches ? d.batches.reduce((a,b)=>a+b.pass,0) : 0;
    return recv < totalQty(d.sizes||{}) && d.status !== 'done';
  }).length;
  var cm=document.getElementById('cnt-may'), cg=document.getElementById('cnt-gc');
  cm.style.display = mayAlert>0?'':'none'; cm.textContent=mayAlert;
  cg.style.display = gcPartial>0?'':'none'; cg.textContent=gcPartial;
}

// ==================== MODAL ====================
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.overlay').forEach(el=>{
  el.addEventListener('click',function(e){ if(e.target===this) this.classList.remove('open'); });
});

function openModalMay(editId){
  DB.editMay = editId||null;
  var d = editId ? DB.may.find(x=>x.id===editId) : null;
  document.getElementById('modal-may-title').textContent = editId ? 'Sửa đơn may' : 'Tạo đơn may mới';
  document.getElementById('m-id').value = d?d.id:'';
  document.getElementById('m-code').value = d?d.code:'';
  document.getElementById('m-date').value = d?d.date:today();
  document.getElementById('m-name').value = d?d.name:'';
  document.getElementById('m-color').value = d?d.color:'';
  document.getElementById('m-factory').value = d?d.factory:'';
  document.getElementById('m-deadline').value = d?d.deadline:'';
  document.getElementById('m-price').value = d?d.price:'';
  document.getElementById('m-status').value = d?d.status:'wait';
  document.getElementById('m-note').value = d?d.note:'';
  document.getElementById('m-error').value = d?d.error:'';
  ['S','M','L','XL'].forEach(s=>{ document.getElementById('sz-'+s).value = d&&d.sizes?d.sizes[s]||'':''; });
  openModal('modal-may');
}

function saveMay(){
  var code = document.getElementById('m-code').value.trim();
  var name = document.getElementById('m-name').value.trim();
  if(!code||!name){ alert('Vui lòng nhập mã đơn và tên hàng'); return; }
  var sizes = {};
  ['S','M','L','XL'].forEach(s=>{ var v=parseInt(document.getElementById('sz-'+s).value)||0; if(v>0) sizes[s]=v; });
  var obj = {
    id: DB.editMay || uid(),
    code, name,
    date: document.getElementById('m-date').value,
    color: document.getElementById('m-color').value,
    sizes,
    factory: document.getElementById('m-factory').value,
    deadline: document.getElementById('m-deadline').value,
    price: parseInt(document.getElementById('m-price').value)||0,
    status: document.getElementById('m-status').value,
    note: document.getElementById('m-note').value,
    error: document.getElementById('m-error').value,
    log: DB.editMay ? (DB.may.find(x=>x.id===DB.editMay)||{}).log||[] : [],
    createdAt: DB.editMay ? (DB.may.find(x=>x.id===DB.editMay)||{}).createdAt||today() : today()
  };
  // add log if status changed
  if(!DB.editMay || (DB.may.find(x=>x.id===DB.editMay)||{}).status !== obj.status){
    obj.log = obj.log||[];
    obj.log.push({date:today(), action: mayStatusInfo(obj.status).label});
  }
  if(DB.editMay){ var i=DB.may.findIndex(x=>x.id===DB.editMay); if(i>-1) DB.may[i]=obj; }
  else DB.may.push(obj);
  save(); closeModal('modal-may'); renderMay(); updateTabBadges();
}

function deleteMay(id){ if(confirm('Xoá đơn này?')){ DB.may=DB.may.filter(x=>x.id!==id); save(); renderMay(); updateTabBadges(); } }

function quickStatusMay(id, status){
  var d=DB.may.find(x=>x.id===id); if(!d) return;
  d.status=status;
  d.log=d.log||[];
  d.log.push({date:today(), action:mayStatusInfo(status).label});
  save(); renderMay(); updateTabBadges();
}

// ==================== GIA CÔNG MODAL ====================
function openModalGC(editId){
  DB.editGC = editId||null;
  var d = editId ? DB.gc.find(x=>x.id===editId) : null;
  document.getElementById('modal-gc-title').textContent = editId ? 'Sửa đơn gia công' : 'Tạo đơn gia công mới';
  document.getElementById('g-id').value = d?d.id:'';
  document.getElementById('g-code').value = d?d.code:'';
  document.getElementById('g-shop').value = d?d.shop:'';
  document.getElementById('g-name').value = d?d.name:'';
  document.getElementById('g-date').value = d?d.date:today();
  document.getElementById('g-price').value = d?d.price:'';
  document.getElementById('g-eta').value = d?d.eta:'';
  document.getElementById('g-status').value = d?d.status:'making';
  document.getElementById('g-note').value = d?d.note:'';
  ['S','M','L','XL'].forEach(s=>{ document.getElementById('gs-'+s).value = d&&d.sizes?d.sizes[s]||'':''; });
  openModal('modal-gc');
}

function saveGC(){
  var code=document.getElementById('g-code').value.trim();
  var name=document.getElementById('g-name').value.trim();
  if(!code||!name){ alert('Vui lòng nhập mã đơn và tên hàng'); return; }
  var sizes={};
  ['S','M','L','XL'].forEach(s=>{ var v=parseInt(document.getElementById('gs-'+s).value)||0; if(v>0) sizes[s]=v; });
  var obj={
    id: DB.editGC||uid(), code, name,
    shop: document.getElementById('g-shop').value,
    date: document.getElementById('g-date').value,
    sizes, price: parseInt(document.getElementById('g-price').value)||0,
    eta: document.getElementById('g-eta').value,
    status: document.getElementById('g-status').value,
    note: document.getElementById('g-note').value,
    batches: DB.editGC ? (DB.gc.find(x=>x.id===DB.editGC)||{}).batches||[] : [],
    createdAt: DB.editGC ? (DB.gc.find(x=>x.id===DB.editGC)||{}).createdAt||today() : today()
  };
  if(DB.editGC){ var i=DB.gc.findIndex(x=>x.id===DB.editGC); if(i>-1) DB.gc[i]=obj; }
  else DB.gc.push(obj);
  save(); closeModal('modal-gc'); renderGC(); updateTabBadges();
}

function deleteGC(id){ if(confirm('Xoá đơn này?')){ DB.gc=DB.gc.filter(x=>x.id!==id); save(); renderGC(); updateTabBadges(); } }

function openBatch(gcId){
  DB.batchTarget=gcId;
  document.getElementById('b-gcid').value=gcId;
  document.getElementById('b-date').value=today();
  ['b-qty','b-pass','b-fail','b-deliver','b-note','b-error'].forEach(x=>{ var el=document.getElementById(x); el.value=''; });
  openModal('modal-batch');
}

function saveBatch(){
  var gc=DB.gc.find(x=>x.id===DB.batchTarget); if(!gc) return;
  var pass=parseInt(document.getElementById('b-pass').value)||0;
  var fail=parseInt(document.getElementById('b-fail').value)||0;
  gc.batches=gc.batches||[];
  gc.batches.push({
    id:uid(),
    date: document.getElementById('b-date').value,
    qty:  parseInt(document.getElementById('b-qty').value)||0,
    pass, fail,
    deliver: document.getElementById('b-deliver').value,
    note: document.getElementById('b-note').value,
    error: document.getElementById('b-error').value
  });
  // auto update status if full
  var totalPass = gc.batches.reduce((a,b)=>a+b.pass,0);
  if(totalPass >= totalQty(gc.sizes||{})) gc.status='done';
  save(); closeModal('modal-batch'); renderGC(); updateTabBadges();
}

// ==================== AUTO PARSE ====================
function autoParseOrder(){
  var raw = document.getElementById('auto-input').value.trim();
  if(!raw){ alert('Vui lòng nhập thông tin đơn'); return; }
  var lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  var created=0;
  lines.forEach(line=>{
    var parts = line.split(/[,|]+/).map(x=>x.trim());
    if(parts.length<2) return;
    var code='', name='', color='', sizes={}, deadline='';
    parts.forEach((p,i)=>{
      if(i===0){ code=p; return; }
      // size pattern
      var sizeMatch = p.match(/([SMLX]{1,2})\s*[:=]\s*(\d+)/gi);
      if(sizeMatch && sizeMatch.length>0){
        sizeMatch.forEach(sm=>{
          var m=sm.match(/([SMLX]{1,2})\s*[:=]\s*(\d+)/i);
          if(m) sizes[m[1].toUpperCase()]=parseInt(m[2]);
        });
        return;
      }
      // date pattern dd/mm or dd/mm/yyyy
      var dateM = p.match(/(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);
      if(dateM){
        var dy=parseInt(dateM[1]),dm=parseInt(dateM[2]),yr=dateM[3]?parseInt(dateM[3]):new Date().getFullYear();
        if(yr<100) yr+=2000;
        deadline=yr+'-'+(dm<10?'0'+dm:dm)+'-'+(dy<10?'0'+dy:dy);
        return;
      }
      // first remaining non-size/non-date = name, second = color
      if(!name){ name=p; return; }
      if(!color){ color=p; return; }
    });
    if(!code||!name) return;
    DB.may.push({
      id:uid(), code, name, color, sizes,
      date:today(), deadline, factory:'', price:0,
      status:'wait', note:'', error:'',
      log:[{date:today(),action:'Tạo từ nhập nhanh'}],
      createdAt:today()
    });
    created++;
  });
  if(created>0){
    save(); renderMay(); updateTabBadges();
    var r=document.getElementById('parse-result');
    r.style.display='block';
    r.textContent='Đã tạo '+created+' đơn thành công!';
    document.getElementById('auto-input').value='';
    setTimeout(()=>r.style.display='none',3000);
  } else {
    alert('Không nhận diện được đơn. Hãy thử định dạng: DM001, tên hàng, màu, S:5 M:10, ngày/tháng');
  }
}

// ==================== FILTER / SEARCH ====================
function setFilterMay(v,el){
  DB.filterMay=v;
  el.closest('.filter-row').querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderMay();
}
function setFilterGC(v,el){
  DB.filterGC=v;
  el.closest('.filter-row').querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderGC();
}
function searchMay(v){ DB.searchMay=v.toLowerCase(); renderMay(); }
function searchGC(v){ DB.searchGC=v.toLowerCase(); renderGC(); }

// ==================== RENDER MAY ====================
function renderMay(){
  var list=DB.may;
  // stats
  var total=list.length, wait=0, sent=0, up=0, late=0, near=0;
  list.forEach(d=>{
    if(d.status==='up') up++;
    else if(d.status==='sent') sent++;
    else wait++;
    var a=getMayAlert(d);
    if(a==='late') late++;
    else if(a==='near') near++;
  });
  document.getElementById('stats-may').innerHTML=
    sc('Tổng đơn',total)+sc('Chờ gửi',wait)+sc('Đã gửi XW',sent)+sc('Đã lên hàng',up,'green')+sc('Trễ hạn',late,'red');

  // filter
  var filtered=list.filter(d=>{
    var a=getMayAlert(d);
    if(DB.filterMay==='sent') return d.status==='sent';
    if(DB.filterMay==='up') return d.status==='up';
    if(DB.filterMay==='near') return a==='near';
    if(DB.filterMay==='late') return a==='late';
    return true;
  });
  // search
  if(DB.searchMay) filtered=filtered.filter(d=>(d.code+d.name+d.color+(d.factory||'')).toLowerCase().includes(DB.searchMay));

  if(!filtered.length){ document.getElementById('list-may').innerHTML='<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">Chưa có đơn nào</div></div>'; return; }

  document.getElementById('list-may').innerHTML=filtered.slice().reverse().map(d=>{
    var alert=getMayAlert(d);
    var si=mayStatusInfo(alert==='late'?'late':d.status);
    var cardCls='order-card'+(alert==='late'?' red-card':alert==='near'?' warn-card':d.status==='up'?' done-card':'');
    var sizeChips=sizesFromIds(d.sizes||{}).map(x=>'<div class="size-chip"><span class="size-label">'+x.s+'</span><span class="size-qty">'+x.q+'</span></div>').join('');
    var total=totalQty(d.sizes||{});
    // deadline countdown
    var du=d.deadline?daysUntil(d.deadline):null;
    var ds=d.date?daysSince(d.date):null;
    var deadlineHtml='';
    if(du!==null){
      var pct=ds!==null?Math.min(100,Math.round(ds/10*100)):0;
      var fillCls=alert==='late'?'red':alert==='near'?'warn':'';
      deadlineHtml='<div class="deadline-bar"><div class="deadline-fill '+fillCls+'" style="width:'+pct+'%"></div></div>';
    }
    var dayInfo='';
    if(d.status!=='up'){
      if(ds!==null) dayInfo='<span>Ngày may: <b>'+ds+' ngày trước</b></span>';
      if(du!==null) dayInfo+=(du>=0?'<span class="'+(alert?'meta-'+(alert==='late'?'highlight':'warn'):'')+'">Còn <b>'+du+' ngày</b></span>':'<span class="meta-highlight">Trễ <b>'+Math.abs(du)+' ngày</b></span>');
    }
    var alertBadge=alert==='late'?'<span class="badge badge-late">Trễ hạn</span>':alert==='near'?'<span class="badge badge-warn">Sắp hết hạn</span>':'';
    var btns='';
    if(d.status==='wait') btns='<button class="btn btn-sm btn-green" onclick="quickStatusMay(\''+d.id+'\',\'sent\')">Xác nhận gửi XW</button>';
    if(d.status==='sent') btns='<button class="btn btn-sm btn-green" onclick="quickStatusMay(\''+d.id+'\',\'up\')">Xác nhận lên hàng</button>';
    var logHtml='';
    if(d.log&&d.log.length){
      logHtml='<div class="log-list">'+d.log.map(l=>'<div class="log-item"><div class="log-dot green"></div><span>'+fmtD(l.date)+' — '+l.action+'</span></div>').join('')+'</div>';
    }
    return '<div class="'+cardCls+'">'+
      '<div class="card-main">'+
        '<div class="card-left">'+
          '<div class="card-row1">'+
            '<span class="order-code">'+d.code+'</span>'+
            '<span class="order-name">'+d.name+(d.color?' · '+d.color:'')+'</span>'+
            '<span class="badge '+si.cls+'">'+si.label+'</span>'+
            alertBadge+
          '</div>'+
          deadlineHtml+
          '<div class="card-meta">'+
            '<span>Ngày cho may: <b>'+fmtDFull(d.date)+'</b></span>'+
            (d.deadline?'<span>Cần lên: <b>'+fmtDFull(d.deadline)+'</b></span>':'')+
            (d.factory?'<span>Xưởng: <b>'+d.factory+'</b></span>':'')+
            '<span>Tổng SL: <b>'+total+'</b></span>'+
            dayInfo+
          '</div>'+
          (sizeChips?'<div class="size-table">'+sizeChips+'</div>':'')+
          (d.note?'<div style="font-size:12px;color:var(--text2);margin-top:4px">📝 '+d.note+'</div>':'')+
          (d.error?'<div style="font-size:12px;margin-top:4px"><span class="error-note">⚠ Lỗi: '+d.error+'</span></div>':'')+
          logHtml+
        '</div>'+
        '<div class="card-right">'+
          '<div class="card-actions">'+
            btns+
            '<button class="btn btn-sm" onclick="openModalMay(\''+d.id+'\')">Sửa</button>'+
            '<button class="btn btn-sm btn-red" onclick="deleteMay(\''+d.id+'\')">Xoá</button>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

// ==================== RENDER GC ====================
function renderGC(){
  var list=DB.gc;
  var total=list.length;
  var totalSP=list.reduce((s,x)=>s+totalQty(x.sizes||{}),0);
  var totalPass=list.reduce((s,x)=>s+(x.batches||[]).reduce((a,b)=>a+b.pass,0),0);
  var totalFail=list.reduce((s,x)=>s+(x.batches||[]).reduce((a,b)=>a+b.fail,0),0);
  var totalMoney=list.reduce((s,x)=>{ var r=(x.batches||[]).reduce((a,b)=>a+b.pass,0); return s+r*x.price; },0);
  document.getElementById('stats-gc').innerHTML=
    sc('Đơn GC',total)+sc('Tổng SP đặt',totalSP)+sc('Đã QC đạt',totalPass,'green')+sc('QC lỗi',totalFail,'red')+sc('Tiền GC',Math.round(totalMoney/1000)+'K','amber');

  var filtered=list.filter(d=>{
    var recv=(d.batches||[]).reduce((a,b)=>a+b.pass,0);
    if(DB.filterGC==='partial') return recv<totalQty(d.sizes||{})&&d.status!=='done';
    if(DB.filterGC!=='all') return d.status===DB.filterGC;
    return true;
  });
  if(DB.searchGC) filtered=filtered.filter(d=>(d.code+d.name+(d.shop||'')).toLowerCase().includes(DB.searchGC));

  if(!filtered.length){ document.getElementById('list-gc').innerHTML='<div class="empty-state"><div class="empty-icon">🧵</div><div class="empty-text">Chưa có đơn nào</div></div>'; return; }

  document.getElementById('list-gc').innerHTML=filtered.slice().reverse().map(d=>{
    var recv=(d.batches||[]).reduce((a,b)=>a+b.pass,0);
    var fail=(d.batches||[]).reduce((a,b)=>a+b.fail,0);
    var tot=totalQty(d.sizes||{});
    var remain=Math.max(0,tot-recv);
    var pct=tot>0?Math.round(recv/tot*100):0;
    var isFull=recv>=tot;
    var si=gcStatusInfo(d.status);
    var cardCls='order-card'+(isFull?' done-card':'');
    var sizeChips=sizesFromIds(d.sizes||{}).map(x=>'<div class="size-chip"><span class="size-label">'+x.s+'</span><span class="size-qty">'+x.q+'</span></div>').join('');
    var batchHtml='';
    if(d.batches&&d.batches.length){
      batchHtml='<div class="batch-list">'+d.batches.map((b,i)=>'<div class="batch-item">'+
        '<div class="batch-date">Đợt '+(i+1)+'<br><span style="font-size:10px;font-weight:400;color:var(--text3)">'+fmtDFull(b.date)+'</span></div>'+
        '<div class="batch-info">'+
          '<span>Về: <b>'+b.qty+'</b></span>'+
          '<span style="color:var(--green)">Đạt: <b>'+b.pass+'</b></span>'+
          (b.fail>0?'<span style="color:var(--red)">Lỗi: <b>'+b.fail+'</b></span>':'')+
          (b.deliver?'<span>Giao shop: <b>'+fmtDFull(b.deliver)+'</b></span>':'')+
        '</div>'+
        '<div style="display:flex;flex-direction:column;gap:3px;align-items:flex-end">'+
          (b.note?'<span class="note-chip">'+b.note+'</span>':'')+
          (b.error?'<span class="error-note">'+b.error+'</span>':'')+
        '</div>'+
      '</div>').join('')+'</div>';
    } else {
      batchHtml='<div style="font-size:12px;color:var(--text3);padding:6px 0">Chưa có đợt hàng nào về</div>';
    }
    var money=recv*d.price;
    return '<div class="'+cardCls+'">'+
      '<div class="card-main">'+
        '<div class="card-left">'+
          '<div class="card-row1">'+
            '<span class="order-code">'+d.code+'</span>'+
            (d.shop?'<span class="order-name">'+d.shop+'</span>':'')+
            '<span class="order-name">'+d.name+'</span>'+
            '<span class="badge '+si.cls+'">'+si.label+'</span>'+
            (isFull?'<span class="badge badge-done-gc">Đủ hàng</span>':'<span class="badge badge-wait">Còn thiếu '+remain+' SP</span>')+
          '</div>'+
          '<div class="progress-row">'+
            '<span class="progress-label">'+pct+'%</span>'+
            '<div class="progress-wrap"><div class="progress-fill'+(pct<50?' warn':'')+'" style="width:'+pct+'%"></div></div>'+
            '<span class="progress-label">'+recv+'/'+tot+'</span>'+
          '</div>'+
          '<div class="card-meta">'+
            '<span>Đặt: <b>'+fmtDFull(d.date)+'</b></span>'+
            (d.eta?'<span>Dự kiến lên hàng: <b>'+fmtDFull(d.eta)+'</b></span>':'')+
            (d.price?'<span>Đơn giá: <b>'+d.price.toLocaleString()+'đ</b></span>':'')+
            (money>0?'<span style="color:var(--green)">Tiền GC: <b>'+money.toLocaleString()+'đ</b></span>':'')+
            '<span>Còn cần lên: <b style="color:'+(remain>0?'var(--amber)':'var(--green)')+'">'+remain+' SP</b></span>'+
          '</div>'+
          (sizeChips?'<div class="size-table">'+sizeChips+'</div>':'')+
          (d.note?'<div style="font-size:12px;color:var(--text2);margin-top:4px">📝 '+d.note+'</div>':'')+
        '</div>'+
        '<div class="card-right">'+
          '<div class="card-actions">'+
            '<button class="btn btn-sm btn-green" onclick="openBatch(\''+d.id+'\')">+ Đợt hàng về</button>'+
            '<button class="btn btn-sm" onclick="openModalGC(\''+d.id+'\')">Sửa</button>'+
            '<button class="btn btn-sm btn-red" onclick="deleteGC(\''+d.id+'\')">Xoá</button>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<div class="card-expand">'+
        '<div class="sub-title">Lịch sử các đợt hàng về</div>'+
        batchHtml+
      '</div>'+
    '</div>';
  }).join('');
}

// ==================== STAT CARD ====================
function sc(label,val,accent){
  return '<div class="stat-card"><div class="stat-label">'+label+'</div><div class="stat-val'+(accent?' '+accent:'')+'">'+val+'</div></div>';
}

// ==================== REPORT ====================
function populateMonths(){
  var sel=document.getElementById('report-month');
  var months=new Set();
  DB.may.forEach(d=>{ if(d.date) months.add(d.date.slice(0,7)); });
  DB.gc.forEach(d=>{ if(d.date) months.add(d.date.slice(0,7)); (d.batches||[]).forEach(b=>{ if(b.date) months.add(b.date.slice(0,7)); }); });
  var now=today().slice(0,7);
  months.add(now);
  var arr=[...months].sort().reverse();
  sel.innerHTML='';
  arr.forEach(m=>{ var op=document.createElement('option'); op.value=m; var p=m.split('-'); op.textContent='Tháng '+p[1]+'/'+p[0]; if(m===now) op.selected=true; sel.appendChild(op); });
}

function renderReport(){
  var m=document.getElementById('report-month').value; if(!m) return;
  var mayDone=DB.may.filter(d=>d.status==='up'&&d.date&&d.date.startsWith(m));
  var gcBatches=DB.gc.map(d=>{
    var bs=(d.batches||[]).filter(b=>b.date&&b.date.startsWith(m));
    var pass=bs.reduce((a,b)=>a+b.pass,0);
    var fail=bs.reduce((a,b)=>a+b.fail,0);
    return {d,pass,fail,money:pass*d.price};
  }).filter(x=>x.pass>0||x.fail>0);
  var totalGCMoney=gcBatches.reduce((s,x)=>s+x.money,0);
  var totalPass=gcBatches.reduce((s,x)=>s+x.pass,0);
  var totalFail=gcBatches.reduce((s,x)=>s+x.fail,0);
  var p=m.split('-');
  document.getElementById('report-content').innerHTML=
    '<div class="stats-grid" style="margin-bottom:20px">'+
      sc('Đơn may HT',mayDone.length,'green')+sc('SP GC đạt QC',totalPass,'green')+sc('SP GC lỗi',totalFail,'red')+sc('Tiền GC phải trả',Math.round(totalGCMoney/1000)+'K','amber')+sc('Đơn GC có hàng về',gcBatches.length)+
    '</div>'+
    '<div class="order-card" style="overflow:hidden">'+
      '<div style="padding:14px 16px;font-weight:700;font-size:14px;border-bottom:1px solid var(--border)">Chi tiết gia công tháng '+p[1]+'/'+p[0]+' — đối soát tiền</div>'+
      (gcBatches.length?'<table class="report-table"><thead><tr><th>Mã đơn</th><th>Cửa hàng</th><th>Tên hàng</th><th>Đã về đạt</th><th>Lỗi</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead><tbody>'+
        gcBatches.map(x=>{
          var tot=totalQty(x.d.sizes||{});
          var isFull=x.d.batches?x.d.batches.reduce((a,b)=>a+b.pass,0)>=tot:false;
          return '<tr'+(isFull?' style="background:var(--green-bg)"':'')+'><td><b>'+x.d.code+'</b></td><td>'+( x.d.shop||'—')+'</td><td>'+x.d.name+'</td><td style="color:var(--green)"><b>'+x.pass+'</b></td><td style="color:var(--red)">'+x.fail+'</td><td>'+( x.d.price?x.d.price.toLocaleString()+'đ':'—')+'</td><td><b>'+(x.d.price?(x.money).toLocaleString()+'đ':'—')+'</b></td></tr>';
        }).join('')+
        '<tr class="total-row"><td colspan="3">Tổng cộng tháng này</td><td>'+totalPass+'</td><td>'+totalFail+'</td><td></td><td>'+totalGCMoney.toLocaleString()+'đ</td></tr>'+
      '</tbody></table>':'<div class="empty-state" style="padding:24px">Không có đợt hàng gia công trong tháng này</div>')+
    '</div>';
}

// ==================== EXPORT CSV ====================
function exportCSV(){
  var rows=[['Loại','Mã đơn','Tên hàng','Màu','S','M','L','XL','Tổng SL','Ngày cho may/đặt','Deadline','Xưởng/Shop','Trạng thái','Đơn giá','Ghi chú','Ghi chú lỗi']];
  DB.may.forEach(d=>{
    var sz=d.sizes||{};
    rows.push(['Đơn may',d.code,d.name,d.color,sz.S||0,sz.M||0,sz.L||0,sz.XL||0,totalQty(sz),d.date,d.deadline,d.factory,mayStatusInfo(d.status).label,d.price,d.note,d.error]);
  });
  DB.gc.forEach(d=>{
    var sz=d.sizes||{}; var recv=(d.batches||[]).reduce((a,b)=>a+b.pass,0); var fail=(d.batches||[]).reduce((a,b)=>a+b.fail,0);
    rows.push(['Gia công',d.code,d.name,'',sz.S||0,sz.M||0,sz.L||0,sz.XL||0,totalQty(sz),d.date,d.eta,d.shop,gcStatusInfo(d.status).label,d.price,d.note,'Đạt:'+recv+' Lỗi:'+fail]);
  });
  var csv=rows.map(r=>r.map(c=>'"'+(c||'').toString().replace(/"/g,'""')+'"').join(',')).join('\n');
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);
  a.download='emwear-'+today()+'.csv';
  a.click();
}

renderMay(); renderGC(); updateTabBadges();
